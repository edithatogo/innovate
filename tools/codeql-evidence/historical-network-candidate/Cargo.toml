[workspace]
resolver = "3"

[package]
name = "innovate-codeql-historical-network-candidate"
version = "0.7.0-alpha.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[lib]
name = "innovate_core"
path = "../../../rust/crates/innovate-core/src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
libm = "=0.2.16"
sha2 = "=0.11.1"
jiff = { version = "=1.0.3", default-features = false, features = ["std"] }
kairo-ecs-core = { git = "https://github.com/edithatogo/kairos.git", rev = "e76b97be2ea3712645933d903822ff6381c8883e" }
kairo-ecs-rng = { git = "https://github.com/edithatogo/kairos.git", rev = "e76b97be2ea3712645933d903822ff6381c8883e" }
kairo-ecs-types = { git = "https://github.com/edithatogo/kairos.git", rev = "e76b97be2ea3712645933d903822ff6381c8883e" }
kairo-ecs-state = { git = "https://github.com/edithatogo/kairos.git", rev = "e76b97be2ea3712645933d903822ff6381c8883e" }
kairo-ecs-des = { git = "https://github.com/edithatogo/kairos.git", rev = "e76b97be2ea3712645933d903822ff6381c8883e" }
petgraph = { version = "=0.8.3", default-features = false }
