[package]
name = "innovate-tabular"
description = "Polars and Arrow IPC boundary for the Innovate Rust core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/edithatogo/innovate"
documentation = "https://docs.rs/innovate-tabular"
readme = "../../../README.md"
keywords = ["innovation", "polars", "arrow", "tabular", "ipc"]
categories = ["science", "data-structures"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
innovate-core.workspace = true
serde_json.workspace = true
polars = { git = "https://github.com/pola-rs/polars.git", rev = "2d74c435e83b86dc2cf6b71ec6c7b4bd67a4042d", default-features = false, features = ["dtype-array", "dtype-struct", "ipc", "ipc_streaming"] }
polars-arrow = { git = "https://github.com/pola-rs/polars.git", rev = "2d74c435e83b86dc2cf6b71ec6c7b4bd67a4042d", default-features = false }
