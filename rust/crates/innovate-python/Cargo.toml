[package]
name = "innovate-python"
description = "Thin Python bindings for the Innovate Rust scientific core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
innovate-core.workspace = true
innovate-tabular = { path = "../innovate-tabular" }
serde_json.workspace = true
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
