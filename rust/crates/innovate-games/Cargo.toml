[workspace]

[package]
name = "innovate-games"
description = "Static game-theoretic adapter for Innovate backed by Paignia without Kairos runtime dependency"
version = "0.7.0-alpha.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/innovate"

[dependencies]
innovate-demand = { path = "../innovate-demand" }
paignia-core = { git = "https://github.com/edithatogo/paignia.git", rev = "bd880dd756d2ba56cc5f479bc078cea31b53c1d1", version = "=0.1.0", default-features = false }
paignia-solve = { git = "https://github.com/edithatogo/paignia.git", rev = "bd880dd756d2ba56cc5f479bc078cea31b53c1d1", version = "=0.1.0", default-features = false }
