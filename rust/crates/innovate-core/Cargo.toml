[package]
name = "innovate-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/edithatogo/innovate"
documentation = "https://docs.rs/innovate-core"
readme = "../../../README.md"
keywords = ["innovation", "diffusion", "bass-model", "forecasting", "simulation"]
categories = ["science", "simulation", "mathematics"]
description = "Rust-owned innovation diffusion scientific kernel"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "workloads"
harness = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
libm = "=0.2.16"
nalgebra = "=0.34.2"
levenberg-marquardt = "=0.15.0"
ode_solvers = "=0.6.2"
petgraph = "=0.8.3"
sha2 = "=0.11.1"
statrs = "=0.19.1"
nuts-rs = "=0.19.1"
rand = "=0.10.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
kairo-ecs-core = { git = "https://github.com/edithatogo/kairos.git", rev = "a1f6283575ad26918230adc122a99b5c08fc4da3" }
kairo-ecs-rng = { git = "https://github.com/edithatogo/kairos.git", rev = "a1f6283575ad26918230adc122a99b5c08fc4da3" }
kairo-ecs-types = { git = "https://github.com/edithatogo/kairos.git", rev = "a1f6283575ad26918230adc122a99b5c08fc4da3" }
kairo-ecs-abm = { git = "https://github.com/edithatogo/kairos.git", rev = "a1f6283575ad26918230adc122a99b5c08fc4da3" }
kairo-ecs-des = { git = "https://github.com/edithatogo/kairos.git", rev = "a1f6283575ad26918230adc122a99b5c08fc4da3" }
