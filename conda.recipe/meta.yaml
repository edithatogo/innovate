package:
  name: innovate
  version: "0.7.0a1"

source:
  path: ..

build:
  script: bash build.sh

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
  host:
    - python ==3.15.2
    - pip
    - maturin ==1.16.0
  run:
    - python >=3.15.2,<3.16
    - polars ==2.1.0

test:
  imports:
    - innovate
    - innovate._native

about:
  home: https://github.com/edithatogo/innovate
  license: Apache-2.0
  license_file: LICENSE
  summary: "Rust-native innovation diffusion modelling with Polars."
