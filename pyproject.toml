[project]
name = "innovate"
version = "0.7.0a1"
description = "Rust-native innovation diffusion modelling with Polars"
requires-python = ">=3.15.2,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE*"]
readme = "README.md"
authors = [{name = "Dylan A Mordaunt", email = "dylan.mordaunt@vuw.ac.nz"}]
dependencies = ["polars==2.1.0"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.15", "Programming Language :: Rust", "Topic :: Scientific/Engineering"]

[project.urls]
Homepage = "https://github.com/edithatogo/innovate"
Documentation = "https://edithatogo.github.io/innovate"

[project.optional-dependencies]
arrow = ["pyarrow==26.0.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "hypothesis==6.170.15", "ruff==0.17.4", "basedpyright==1.40.2", "nox==2026.10.20", "maturin==1.16.0", "griffe==2.4.1", "twine==7.0.0", "check-wheel-contents==0.6.3", "bandit==1.9.4", "pip-audit==2.10.1", "zizmor==1.32.0", "pre-commit==4.7.0", "pre-commit-hooks==6.0.0", "codespell==2.4.3", "nbstripout==0.9.1"]

[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/crates/innovate-python/Cargo.toml"
python-source = "bindings/python"
module-name = "innovate._native"
features = ["pyo3/extension-module"]
include = [
    {path = "LICENSE", format = "sdist"},
    {path = "tests/native/test_competition.py", format = "sdist"},
    {path = "tests/native/test_multi_generation.py", format = "sdist"},
    {path = "tests/native/test_paired_outcomes.py", format = "sdist"},
    {path = "tests/native/test_python_consumer.py", format = "sdist"},
    {path = "specs/ecosystem/voiage/uncertainty/diffusion_v1/*.csv", format = "sdist"},
    {path = "conductor/tracks/scientific_ecosystem_alignment_20261029/evidence/sarima-reference/historical-initialization.json", format = "sdist"},
    {path = "conductor/tracks/scientific_ecosystem_alignment_20261029/evidence/sarima-reference/stationary-fixed.json", format = "sdist"},
    {path = "conductor/tracks/scientific_ecosystem_alignment_20261029/evidence/stl-reference-20261107/reference.json", format = "sdist"},
]

[tool.pytest.ini_options]
minversion = "9.2"
addopts = "-ra -q --tb=short"
testpaths = ["tests/native"]

[tool.ruff]
target-version = "py315"
src = ["bindings/python"]
line-length = 120
include = ["bindings/python/**/*.py", "tests/native/**/*.py", "noxfile.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
pythonVersion = "3.15"
include = ["bindings/python/innovate"]
typeCheckingMode = "standard"
