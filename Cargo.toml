[workspace]
members = ["rust/crates/innovate-core", "rust/crates/innovate-tabular", "rust/crates/innovate-ffi", "rust/crates/innovate-python", "rust/crates/innovate-kairos"]
exclude = ["rust/crates/innovate-games", "rust/vendor/simba-0.9.1", "rust/vendor/nalgebra-0.34.2", "rust/vendor/levenberg-marquardt-0.15.0", "rust/vendor/ode_solvers-0.6.2", "rust/vendor/nuts-rs-0.19.1", "rust/vendor/faer-0.24.4", "rust/vendor/faer-traits-0.24.0", "rust/vendor/qd-0.8.0", "rust/vendor/pulp-0.22.3", "rust/vendor/gemm-0.19.0", "rust/vendor/gemm-common-0.19.0", "rust/vendor/gemm-c32-0.19.0", "rust/vendor/gemm-c64-0.19.0", "rust/vendor/gemm-f32-0.19.0", "rust/vendor/gemm-f64-0.19.0", "rust/vendor/gemm-f16-0.19.0"]
resolver = "3"

[workspace.package]
version = "0.7.0-alpha.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/innovate"

[workspace.dependencies]
innovate-core = { path = "rust/crates/innovate-core", version = "0.7.0-alpha.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
