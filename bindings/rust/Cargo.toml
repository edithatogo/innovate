[package]
name = "innovate-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Rust bindings over the Innovate functional kernel"
documentation = "https://docs.rs/innovate-rs"
homepage = "https://github.com/edithatogo/innovate"
repository = "https://github.com/edithatogo/innovate"
readme = "README.md"
keywords = ["innovation", "diffusion", "kernel", "bindings"]
categories = ["api-bindings", "science"]
include = [
  "Cargo.toml",
  "README.md",
  "benches/**",
  "examples/**",
  "inst/**",
  "scripts/**",
  "src/**",
]

[lib]
name = "innovate_rust"
path = "src/lib.rs"

[dependencies]
# Kairos DES/ABM integration crates (from github.com/edithatogo/kairos @ fae901558f07b7b717a676adbafbe2cdc78dea1c)
kairo-ecs-types = { git = "https://github.com/edithatogo/kairos.git", rev = "fae901558f07b7b717a676adbafbe2cdc78dea1c" }
kairo-ecs-core = { git = "https://github.com/edithatogo/kairos.git", rev = "fae901558f07b7b717a676adbafbe2cdc78dea1c" }
kairo-ecs-state = { git = "https://github.com/edithatogo/kairos.git", rev = "fae901558f07b7b717a676adbafbe2cdc78dea1c" }
kairo-ecs-rng = { git = "https://github.com/edithatogo/kairos.git", rev = "fae901558f07b7b717a676adbafbe2cdc78dea1c" }
kairo-ecs-des = { git = "https://github.com/edithatogo/kairos.git", rev = "fae901558f07b7b717a676adbafbe2cdc78dea1c" }
kairo-ecs-abm = { git = "https://github.com/edithatogo/kairos.git", rev = "fae901558f07b7b717a676adbafbe2cdc78dea1c" }
kairo-ecs-arrow = { git = "https://github.com/edithatogo/kairos.git", rev = "fae901558f07b7b717a676adbafbe2cdc78dea1c" }
# Standard dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
criterion = "=0.8.2"
dhat = "0.3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[bench]]
name = "native_kernel"
harness = false
