name: Publish to PyPI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      authentication_only:
        description: Verify PyPI authentication without building or uploading a release
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  authenticate:
    name: Verify PyPI authentication
    if: github.event_name == 'workflow_dispatch' && inputs.authentication_only
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Exchange GitHub identity for a short-lived PyPI token
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" |
            jq -ec '{token: (.value | select(type == "string" and length > 0))}' |
            curl --silent --show-error --fail -H 'Content-Type: application/json' \
              --data-binary @- https://pypi.org/_/oidc/mint-token |
            jq -e '.success == true and (.token | startswith("pypi-"))' > /dev/null
          echo 'Production PyPI accepted the GitHub Actions identity.'

  pypi-publish:
    name: Upload release to PyPI
    if: github.event_name == 'release' || (github.ref_type == 'tag' && !inputs.authentication_only)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/innovate
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false

      - name: Set up Python
        run: uv venv .venv-release --python 3.15.2

      - name: Verify release version matches the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(.venv-release/bin/python -c 'import tomllib; from pathlib import Path; print("v" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Expected release tag $expected, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            oid=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$expected" --jq 'select(.object.type == "tag") | .object.sha')
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$oid" --jq 'select(.verification.verified and .object.type == "commit") | .object.sha')
            test "$commit" = "$(git rev-parse HEAD)"
            gh api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status | grep -Ex 'ahead|identical'
          fi

      - name: Require complete native scientific migration
        run: .venv-release/bin/python scripts/check_migration.py --release

      - name: Install dependencies
        run: UV_PROJECT_ENVIRONMENT=.venv-release uv sync --locked --no-install-project --python .venv-release/bin/python

      - name: Build package with normalized SBOM
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python="$PWD/.venv-release/bin/python"
          maturin="$PWD/.venv-release/bin/maturin"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          "$maturin" sdist --out dist
          mkdir "$staging/source"
          tar -xzf dist/innovate-*.tar.gz -C "$staging/source"
          source_root=("$staging"/source/innovate-*)
          test "${#source_root[@]}" -eq 1
          (
            cd "${source_root[0]}"
            "$maturin" build --release --locked -i "$python" --out "$staging/wheels"
          )
          for wheel in "$staging"/wheels/*.whl; do
            "$python" scripts/normalize_wheel_sbom.py "$wheel" "${source_root[0]}" "dist/${wheel##*/}"
          done

      - name: Validate package metadata and wheel contents
        run: |
          .venv-release/bin/twine check dist/*
          .venv-release/bin/check-wheel-contents dist/*.whl

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
