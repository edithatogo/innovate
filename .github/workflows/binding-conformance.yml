name: Binding Conformance

permissions:
  contents: read

on:
  push:
    branches: [work, main]
  pull_request:
    branches: [work, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run binding conformance tests
        run: |
          uv run pytest \
            tests/unit/test_polyglot_binding_conformance.py \
            tests/unit/test_polyglot_binding_golden_fixtures.py \
            tests/unit/test_polyglot_binding_hardening.py \
            -q

      - name: Upload binding conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binding-conformance-evidence
          path: |
            docs/source/_static/binding_conformance_inventory.json
            docs/source/_static/binding_golden_fixtures.json
            docs/source/_static/binding_hardening_evidence.json
          if-no-files-found: error
