name: Security and Quality

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          vulnerability-check: true
          license-check: true

  rust-advisories:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - name: Install Cargo Audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Scan the committed Rust lock
        run: cargo audit --file Cargo.lock

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow and policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/actionlint_1.7.9_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            '233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4' "$archive" |
            sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$GITHUB_WORKSPACE" actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color
      - name: Test CI workflow controls
        run: node --test tests/workflows/*.test.cjs
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Select repository-local policy environment
        run: |
          uv venv .venv-policy --python 3.15.2
          .venv-policy/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 2)'
          uv pip install --python .venv-policy/bin/python zizmor==1.32.0 ruff==0.17.4
      - name: Audit GitHub Actions security posture
        run: .venv-policy/bin/zizmor .github/workflows/*.yml
      - name: Test repository policy drift detection
        run: .venv-policy/bin/python -m unittest discover -s tests/workflows -p 'test_repository_policy.py' -v
      - name: Lint repository policy tooling
        run: |
          .venv-policy/bin/ruff check --config 'include = ["scripts/check_repository_policy.py", "tests/workflows/test_repository_policy.py"]' scripts/check_repository_policy.py tests/workflows/test_repository_policy.py
          .venv-policy/bin/ruff format --check --config 'include = ["scripts/check_repository_policy.py", "tests/workflows/test_repository_policy.py"]' scripts/check_repository_policy.py tests/workflows/test_repository_policy.py
      - name: Validate repository policy
        run: |
          .venv-policy/bin/python scripts/check_repository_policy.py --json
      - name: Validate container digest pinning policy
        run: |
          .venv-policy/bin/python - <<'PY'
          from pathlib import Path
          import re
          import sys

          dockerfile = Path("Dockerfile").read_text(encoding="utf-8")
          unpinned = []
          for lineno, line in enumerate(dockerfile.splitlines(), 1):
              stripped = line.strip()
              if stripped.startswith("FROM "):
                  image = stripped.split()[1]
                  if "@sha256:" not in image:
                      unpinned.append(f"Dockerfile:{lineno}: {image}")
              elif stripped.startswith("COPY ") and "--from=" in stripped:
                  m = re.search(r"--from=(\S+)", stripped)
                  if m:
                      ref = m.group(1)
                      if (":" in ref or "/" in ref) and "@sha256:" not in ref:
                          unpinned.append(f"Dockerfile:{lineno}: {ref}")
          if unpinned:
              print("Unpinned container image references found:")
              for item in unpinned:
                  print(" ", item)
              sys.exit(1)
          print("Container digest pinning check passed.")
          PY

  python-quality:
    name: Python quality harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.15.2
      - name: Select native Rust compiler
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - name: Install locked development environment
        run: uv sync --locked --python 3.15.2
      - name: Run Ruff checks
        run: |
          uv run --no-sync ruff check bindings/python tests/native
          uv run --no-sync ruff format --check bindings/python tests/native
      - name: Run security and type checks
        run: |
          uv run --no-sync bandit -r bindings/python/innovate -q
          uv run --no-sync basedpyright
      - name: Run native binding test gate
        run: uv run --no-sync pytest tests/native
