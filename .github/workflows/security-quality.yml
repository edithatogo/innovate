name: Security and Quality

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          vulnerability-check: true
          license-check: true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow and policy lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl --fail --silent --show-error https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color
      - name: Install zizmor
        run: python -m pip install --disable-pip-version-check zizmor
      - name: Audit GitHub Actions security posture
        run: zizmor .github/workflows/security-quality.yml .github/workflows/scorecard.yml
      - name: Validate dependency policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          required = {".github/dependabot.yml", "SECURITY.md", "CODEOWNERS"}
          missing = sorted(path for path in required if not Path(path).is_file())
          if missing:
              print("Missing repository security controls:", ", ".join(missing))
              sys.exit(1)
          print("Repository security policy files are present.")
          PY

  python-quality:
    name: Python quality harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --locked --python 3.14
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
      - name: Run security and type checks
        run: |
          uv run bandit -r src/innovate -c pyproject.toml
          uv run basedpyright --warnings src/innovate
      - name: Run focused test gate
        run: uv run pytest tests/unit -m "not optional_backend" --cov=innovate --cov-report=term-missing --cov-fail-under=0
