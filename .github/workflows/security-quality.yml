name: Security and Quality

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          vulnerability-check: true
          license-check: true

  rust-advisories:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - name: Install Cargo Audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Scan the committed Rust lock
        run: cargo audit --file Cargo.lock

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow and policy lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl --fail --silent --show-error https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Select repository-local policy environment
        run: |
          uv venv .venv-policy --python 3.15.2
          .venv-policy/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 2)'
          uv pip install --python .venv-policy/bin/python zizmor==1.32.0
      - name: Audit GitHub Actions security posture
        run: .venv-policy/bin/zizmor .github/workflows/security-quality.yml .github/workflows/scorecard.yml
      - name: Validate dependency policy
        run: |
          .venv-policy/bin/python - <<'PY'
          from pathlib import Path
          import sys

          required = {".github/dependabot.yml", ".github/renovate.json", "SECURITY.md", "CODEOWNERS"}
          missing = sorted(path for path in required if not Path(path).is_file())
          if missing:
              print("Missing repository security controls:", ", ".join(missing))
              sys.exit(1)
          print("Repository security policy files are present.")
          PY

  python-quality:
    name: Python quality harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.15.2
      - name: Select native Rust compiler
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - name: Install locked development environment
        run: uv sync --locked --python 3.15.2
      - name: Run Ruff checks
        run: |
          uv run --no-sync ruff check bindings/python tests/native
          uv run --no-sync ruff format --check bindings/python tests/native
      - name: Run security and type checks
        run: |
          uv run --no-sync bandit -r bindings/python/innovate -q
          uv run --no-sync basedpyright
      - name: Run native binding test gate
        run: uv run --no-sync pytest tests/native
