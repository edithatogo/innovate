name: Publish to TestPyPI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      authentication_only:
        description: Verify TestPyPI authentication without building or uploading a release
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  authenticate:
    name: Verify TestPyPI authentication
    if: github.event_name == 'workflow_dispatch' && inputs.authentication_only
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Exchange GitHub identity for a short-lived TestPyPI token
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=testpypi" "$ACTIONS_ID_TOKEN_REQUEST_URL" |
            jq -ec '{token: (.value | select(type == "string" and length > 0))}' |
            curl --silent --show-error --fail -H 'Content-Type: application/json' \
              --data-binary @- https://test.pypi.org/_/oidc/mint-token |
            jq -e '.success == true and (.token | startswith("pypi-"))' > /dev/null
          echo 'TestPyPI accepted the GitHub Actions identity.'

  pypi-publish:
    name: Upload release to TestPyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/innovate
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false

      - name: Set up Python
        run: uv venv .venv-release --python 3.15.2

      - name: Require complete native scientific migration
        run: .venv-release/bin/python scripts/check_migration.py --release

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.100.0

      - name: Install dependencies
        run: UV_PROJECT_ENVIRONMENT=.venv-release uv sync --locked --no-install-project --python .venv-release/bin/python

      - name: Build package with normalized SBOM
        run: bash scripts/build_release_wheel.sh

      - name: Validate package metadata and wheel contents
        run: |
          .venv-release/bin/twine check dist/*
          .venv-release/bin/check-wheel-contents dist/*.whl

      - name: Inventory the exact publication wheel and frozen runtime
        run: bash scripts/generate_release_sbom.sh

      - name: Gate embedded wheel Rust dependencies with Grype
        uses: edithatogo/repository-standards/.github/actions/grype-scan@bc76f1fbe0fa87a1371eadc06b08f54b48c623f7
        with:
          sbom: .grype-inputs/wheel-rust.sbom.cdx.json
          mode: enforce
          artifact-name: grype-wheel-rust
          output-directory: .grype-rust-evidence

      - name: Gate installed Python runtime dependencies with Grype
        uses: edithatogo/repository-standards/.github/actions/grype-scan@bc76f1fbe0fa87a1371eadc06b08f54b48c623f7
        with:
          sbom: .grype-inputs/python.sbom.cdx.json
          mode: enforce
          artifact-name: grype-wheel-python
          output-directory: .grype-python-evidence

      - name: Retain publication subject binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grype-wheel-inputs
          path: .grype-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Verify publication bytes remain unchanged
        run: sha256sum --check .grype-inputs/subjects.sha256

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
