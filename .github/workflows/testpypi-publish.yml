name: Publish to TestPyPI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      authentication_only:
        description: Verify TestPyPI authentication without building or uploading a release
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  authenticate:
    name: Verify TestPyPI authentication
    if: github.event_name == 'workflow_dispatch' && inputs.authentication_only
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Exchange GitHub identity for a short-lived TestPyPI token
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=testpypi" "$ACTIONS_ID_TOKEN_REQUEST_URL" |
            jq -ec '{token: (.value | select(type == "string" and length > 0))}' |
            curl --silent --show-error --fail -H 'Content-Type: application/json' \
              --data-binary @- https://test.pypi.org/_/oidc/mint-token |
            jq -e '.success == true and (.token | startswith("pypi-"))' > /dev/null
          echo 'TestPyPI accepted the GitHub Actions identity.'

  pypi-publish:
    name: Upload release to TestPyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/innovate
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false

      - name: Set up Python
        run: uv venv .venv-release --python 3.15.2

      - name: Require complete native scientific migration
        run: .venv-release/bin/python scripts/check_migration.py --release

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1

      - name: Install dependencies
        run: UV_PROJECT_ENVIRONMENT=.venv-release uv sync --locked --no-install-project --python .venv-release/bin/python

      - name: Build package with normalized SBOM
        run: bash scripts/build_release_wheel.sh

      - name: Validate package metadata and wheel contents
        run: |
          .venv-release/bin/twine check dist/*
          .venv-release/bin/check-wheel-contents dist/*.whl

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          repository-url: https://test.pypi.org/legacy/
