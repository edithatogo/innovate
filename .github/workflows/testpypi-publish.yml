name: Publish to TestPyPI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      authentication_only:
        description: Verify TestPyPI authentication without building or uploading a release
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  authenticate:
    name: Verify TestPyPI authentication
    if: github.event_name == 'workflow_dispatch' && inputs.authentication_only
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Exchange GitHub identity for a short-lived TestPyPI token
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=testpypi" |
            jq -ec '{token: (.value | select(type == "string" and length > 0))}' |
            curl --silent --show-error --fail -H 'Content-Type: application/json' \
              --data-binary @- https://test.pypi.org/_/oidc/mint-token |
            jq -e '.success == true and (.token | startswith("pypi-"))' > /dev/null
          echo 'TestPyPI accepted the GitHub Actions identity.'

  pypi-publish:
    name: Upload release to TestPyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/innovate
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Set up Python
        run: uv python install 3.15.1

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uv run twine check dist/*

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
