name: Publish Rust Crates

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate crate packaging without uploading to crates.io
        type: boolean
        default: true
  release:
    types: [published]

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  crates-publish:
    name: Publish crates to crates.io (triggers docs.rs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Select native Rust compiler
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Select isolated release checker
        run: uv venv .venv-release --python 3.15.2

      - name: Verify docs.rs build before publishing
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo doc --locked --no-deps -p innovate-core -p innovate-tabular

      - name: Mint short-lived crates.io token via Trusted Publishing and publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}:${DRY_RUN}" in
            workflow_dispatch:true|workflow_dispatch:false|release:) ;;
            *) echo "::error::Unsupported publishing mode"; exit 2 ;;
          esac
          # Neither a dry run nor an upload can waive scientific release readiness.
          .venv-release/bin/python scripts/check_migration.py --release
          cargo publish --locked --dry-run -p innovate-core -p innovate-tabular
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi
          jwt="$(curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://crates.io" |
            jq -er '.value')"
          token="$(jq -nc --arg jwt "$jwt" '{jwt: $jwt}' |
            curl --silent --show-error --fail \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: edithatogo-innovate-ci' \
              --data-binary @- \
              https://crates.io/api/v1/trusted_publishing/tokens |
            jq -er '.token')"
          echo "::add-mask::$token"
          export CARGO_REGISTRY_TOKEN="$token"
          cargo publish --locked -p innovate-core -p innovate-tabular
