name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install .[dev]
        pip install pytest-cov

    - name: Run tests and collect coverage
      run: pytest --cov=innovate --cov-report=xml
      env:
        PYTHONPATH: src

    - name: Run static type checking with mypy
      run: mypy src/innovate

    - name: Run static type checking with pyright
      run: pyright src/innovate

    - name: Run static type checking with ty
      run: ty check src/innovate

    - name: Run security scan
      run: bandit -r src/innovate

    - name: Run Pandera validation check
      run: python -c "import pandera; print('Pandera available')" || echo "Pandera not required in this step"

    - name: Run Pydantic validation check
      run: python -c "import pydantic; print('Pydantic available')" || echo "Pydantic not required in this step"

    - name: Run hypothesis testing
      run: python -m pytest tests/ -k hypothesis --tb=short || echo "No hypothesis tests found"

    - name: Check Jupyter notebooks with nbqa
      run: |
        find . -name "*.ipynb" -exec nbqa black {} \; --check || echo "Notebook formatting check completed"
        find . -name "*.ipynb" -exec nbqa ruff {} \; --check || echo "Notebook linting check completed"

    - name: Run benchmarks (if any)
      run: pytest --benchmark-only --benchmark-skip --collect-only 2>/dev/null || echo "No benchmarks to run"

    - name: Run safety check
      run: |
        safety check -r requirements.txt || echo "Safety check completed"

    - name: Run pylint check
      run: |
        pylint src/innovate --disable=all --enable=unused-import,W0611,W0613,C0103,C0114,C0115,C0116 || echo "Pylint check completed"

    - name: Run vulture check
      run: |
        pip install vulture
        vulture src/innovate/ --min-confidence 60 || echo "Vulture check completed"

    - name: Run unimport check
      run: |
        pip install unimport
        unimport --check --diff src/innovate || echo "Unimport check completed"

    - name: Run lizard code complexity check
      run: |
        pip install lizard
        lizard src/innovate || echo "Lizard check completed"

    - name: Run syrupy snapshot tests
      run: |
        python -c "import syrupy; print('Syrupy available')" || echo "Syrupy check completed"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true
