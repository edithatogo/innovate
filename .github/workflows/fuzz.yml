name: Continuous Fuzzing

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz innovate-core JSON contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Select nightly Rust toolchain for libFuzzer
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: "fuzz -> target"
          shared-key: "fuzz"

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-fuzz

      - name: Run kernel_request fuzz target
        run: cargo fuzz run kernel_request -- -max_total_time=30
