name: Continuous Fuzzing

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz innovate-core JSON contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Select nightly Rust toolchain for libFuzzer
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run kernel_request fuzz target
        run: cargo fuzz run kernel_request -- -max_total_time=30
