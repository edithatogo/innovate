name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  tagbot:
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@87cc4cc2b4639f6c743f5772f376a32914060732
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
