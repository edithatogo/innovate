name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  tagbot:
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@e4c81aa138ef4179bddea165bb4a9680c223aca4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
