name: Dependency Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python
        run: uv venv .venv-dashboard --python 3.15.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

        with:
          toolchain: 1.99.1

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        with:
          version: "1.13"

      - name: Install JavaScript dependencies
        run: |
          pnpm --dir docs/astro-site install --frozen-lockfile

      - name: Generate dependency dashboard
        run: .venv-dashboard/bin/python scripts/dependency_dashboard.py --output-dir dependency-dashboard

      - name: Upload dependency dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-dashboard
          path: dependency-dashboard
