name: Dependency Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "26"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Set up R
        uses: r-lib/actions/setup-r@1b6976fa8cb4659b87612c6aeb55a73e5f2a13cc # v2

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install JavaScript dependencies
        run: |
          pnpm --dir docs/astro-site install --frozen-lockfile
          npm ci --prefix bindings/typescript

      - name: Generate dependency dashboard
        run: uv run python scripts/dependency_dashboard.py --output-dir dependency-dashboard

      - name: Upload dependency dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-dashboard
          path: dependency-dashboard
