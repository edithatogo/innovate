# This workflow is based on the example from:
# https://github.com/conda-incubator/setup-miniconda

name: Publish Conda Package

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - name: Enforce native migration acceptance before Conda publication
        run: |
          uv venv .venv-release --python 3.15.2
          .venv-release/bin/python scripts/check_migration.py --release

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5
        with:
          auto-update-conda: true
          python-version: "3.15.2"
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Build conda package
        shell: bash -l {0}
        run: conda build conda.recipe

      - name: Publish to Anaconda
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          conda install anaconda-client
          package_path="$(conda build conda.recipe --output)"
          anaconda -t "$ANACONDA_API_TOKEN" upload --user edithatogo --label main "$package_path"
