# This workflow is based on the example from:
# https://github.com/conda-incubator/setup-miniconda

name: Publish Conda Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          auto-update-conda: true
          python-version: "3.14"
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Build conda package
        shell: bash -l {0}
        run: conda build .

      - name: Publish to Anaconda
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          conda install anaconda-client
          package_path="$(conda build . --output)"
          anaconda -t "$ANACONDA_API_TOKEN" upload --user edithatogo --label main "$package_path"
