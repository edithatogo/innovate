name: CI

permissions:
  contents: read

on:
  push:
    branches: [work, main]
  pull_request:
    branches: [work, main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Vale
        uses: vale-cli/vale-action@v2.1.1
        with:
          files: README.md,docs,conductor,specs
          separator: ","
          vale_flags: "--minAlertLevel=suggestion"

  # -----------------------------------------------------------------------
  # Test Matrix
  # -----------------------------------------------------------------------
  unit-tests-base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Install package
        run: uv pip install -e .

      - name: Run required unit gate
        run: |
          CI=true uv run python -m pytest tests/unit/ -m "not optional_backend" \
            --ignore=tests/unit/test_bayesian_fitter_robust.py \
            --ignore=tests/unit/test_blackjax_fitter.py \
            --ignore=tests/unit/test_dynamics_competition_direct.py \
            --ignore=tests/unit/test_dynamics_contagion_direct.py \
            --ignore=tests/unit/test_categorization.py \
            --ignore=tests/unit/test_path_dependence.py \
            --ignore=tests/unit/test_preprocess.py \
            --ignore=tests/unit/test_plots_diagnostics.py \
            --ignore=tests/unit/test_plots_network.py \
            --ignore=tests/unit/test_advanced_functionality_comprehensive.py \
            --ignore=tests/unit/test_curve_fitter.py \
            --cov=innovate \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            --tb=short \
            -q
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  optional-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install optional backend dependencies
        run: uv sync --extra jax --extra bayesian

      - name: Install package
        run: uv pip install -e .

      - name: Run optional backend unit gate
        run: |
          CI=true uv run python -m pytest tests/unit/ \
            -m optional_backend \
            --cov=innovate \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            --tb=short \
            -q
        env:
          JAX_PLATFORM_NAME: cpu

  # -----------------------------------------------------------------------
  # Lint & Format
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

  docs-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build docs smoke target
        run: uv run python -m sphinx -b html docs/source /tmp/innovate-docs-build

  rust-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        working-directory: bindings/rust
        run: cargo fmt --check

      - name: Run Rust binding tests
        working-directory: bindings/rust
        run: cargo test

  rust-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust benchmark harness compiles
        working-directory: bindings/rust
        run: cargo bench --bench native_kernel --no-run

  typescript-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: bindings/typescript
        run: npm ci

      - name: Check TypeScript schema compatibility
        working-directory: bindings/typescript
        run: npm run schema:check

      - name: Type-check TypeScript bindings
        working-directory: bindings/typescript
        run: npm run typecheck

      - name: Run TypeScript binding tests
        working-directory: bindings/typescript
        run: npm test

  go-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod

      - name: Run Go binding tests
        working-directory: bindings/go
        run: go test ./...

  julia-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate Julia binding project
        run: julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate()'

      - name: Run Julia binding tests
        run: julia --project=bindings/julia bindings/julia/test/runtests.jl

  r-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R binding dependencies
        run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'

      - name: Run R binding tests
        run: Rscript bindings/r/tests/run.R

  csharp-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"

      - name: Restore C# binding dependencies
        run: dotnet restore bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj

      - name: Test C# bindings
        run: dotnet test bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj --configuration Release --no-restore

  # -----------------------------------------------------------------------
  # Type Checking
  # -----------------------------------------------------------------------
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run ty (verified public API surface)
        run: |
          uv run ty check \
            src/innovate/__init__.py \
            src/innovate/backend.py \
            src/innovate/backends/__init__.py \
            src/innovate/capabilities.py \
            src/innovate/diffuse/__init__.py \
            src/innovate/substitute/__init__.py \
            src/innovate/ecosystem/__init__.py

      - name: Run mypy (verified public API surface)
        run: |
          uv run mypy \
            src/innovate/__init__.py \
            src/innovate/backend.py \
            src/innovate/backends/__init__.py \
            src/innovate/capabilities.py \
            src/innovate/diffuse/__init__.py \
            src/innovate/substitute/__init__.py \
            src/innovate/ecosystem/__init__.py

  # -----------------------------------------------------------------------
  # Optional Extended Suites
  # -----------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Run integration tests
        run: CI=true uv run python -m pytest tests/integration/ -m integration --tb=short -q
        env:
          JAX_PLATFORM_NAME: cpu

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Run e2e tests
        run: CI=true uv run python -m pytest tests/e2e/ -m e2e --tb=short -q
        env:
          JAX_PLATFORM_NAME: cpu

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Bandit security scan
        run: uv run bandit -r src/innovate -c pyproject.toml

      - name: Run Safety vulnerability scan
        run: uv run safety check

  # -----------------------------------------------------------------------
  # Benchmarks (optional, triggered on demand)
  # -----------------------------------------------------------------------
  benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Install package
        run: uv pip install -e .

      - name: Run Scalene profiling
        run: uv run scalene src/innovate --cli --reduced-profile

      - name: Run pytest benchmarks
        run: uv run pytest --benchmark-only --benchmark-json=benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json

  # -----------------------------------------------------------------------
  # Mutation Testing (weekly schedule)
  # -----------------------------------------------------------------------
  mutation-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install package
        run: uv pip install -e .

      - name: Run mutmut
        run: uv run mutmut run --paths-to-mutate src/innovate/diffuse src/innovate/compete src/innovate/substitute
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Show mutmut results
        run: uv run mutmut results
