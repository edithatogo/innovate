name: CI

permissions:
  contents: read

on:
  push:
    branches: [work, main]
  pull_request:
    branches: [work, main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Test Matrix
  # -----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Install package
        run: uv pip install -e .

      - name: Run unit tests
        run: uv run pytest tests/unit/ -m unit --cov=innovate --cov-report=xml --cov-report=term-missing
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Run integration tests
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: uv run pytest tests/integration/ tests/e2e/ -m integration --tb=short
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Run e2e tests (main only)
        if: github.ref == 'refs/heads/main'
        run: uv run pytest tests/e2e/ -m e2e --tb=short
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # -----------------------------------------------------------------------
  # Lint & Format
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run actionlint
        uses: rhysd/actionlint-action@v1

  # -----------------------------------------------------------------------
  # Type Checking
  # -----------------------------------------------------------------------
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run ty (primary type checker)
        run: uv run ty check src/innovate || true

      - name: Run mypy (secondary type checker)
        run: uv run mypy src/innovate

  # -----------------------------------------------------------------------
  # Security
  # -----------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Bandit security scan
        run: uv run bandit -r src/innovate -c pyproject.toml

      - name: Run Safety vulnerability scan
        run: uv run safety check || true

  # -----------------------------------------------------------------------
  # Benchmarks (optional, triggered on demand)
  # -----------------------------------------------------------------------
  benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Install package
        run: uv pip install -e .

      - name: Run Scalene profiling
        run: uv run scalene src/innovate --cli --reduced-profile || true

      - name: Run pytest benchmarks
        run: uv run pytest --benchmark-only --benchmark-json=benchmark.json || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json

  # -----------------------------------------------------------------------
  # Mutation Testing (weekly schedule)
  # -----------------------------------------------------------------------
  mutation-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install package
        run: uv pip install -e .

      - name: Run mutmut
        run: uv run mutmut run --paths-to-mutate src/innovate/diffuse src/innovate/compete src/innovate/substitute
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Show mutmut results
        run: uv run mutmut results || true
