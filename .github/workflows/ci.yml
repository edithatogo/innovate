name: CI
permissions:
  contents: read
on:
  push:
    branches: [work, main]
  pull_request:
    branches: [work, main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-native
  cancel-in-progress: true
jobs:
  native-python:
    # Scheduled installed-consumer/container/benchmark lanes need a larger budget.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: uv sync --locked --python 3.15.2
        env:
          CARGO_BUILD_JOBS: '2'
      - run: uv run --no-sync python -c "import sys; assert sys.version_info[:3] == (3, 15, 2)"
      - name: Run native tests with replay evidence
        id: native-tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-test-evidence
          git rev-parse HEAD > native-test-evidence/source-revision.txt
          rustc --version --verbose > native-test-evidence/rustc.txt
          cargo --version > native-test-evidence/cargo.txt
          uv run --no-sync python -c "import hashlib, pathlib; print(hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest())" > native-test-evidence/cargo-lock.sha256
          status=0
          cargo test --locked -p innovate-core -p innovate-tabular -p innovate-ffi -j 2 2>&1 | tee native-test-evidence/cargo-test.log || status=$?
          printf '%s\n' "$status" > native-test-evidence/exit-code.txt
          exit "$status"
      - name: Retain native test evidence
        if: always() && (steps.native-tests.outcome == 'success' || steps.native-tests.outcome == 'failure' || steps.native-tests.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-evidence-${{ matrix.os }}
          path: native-test-evidence/
          if-no-files-found: error
          retention-days: 30
      - run: uv run --no-sync pytest tests/native
      - run: uv run --no-sync python scripts/check_migration.py
      - run: cargo fmt --all --check
      - name: Verify Rust docs.rs documentation build
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo doc --locked --no-deps -p innovate-core -p innovate-tabular -p innovate-ffi
      - run: uv run --no-sync ruff check bindings/python tests/native noxfile.py scripts/check_migration.py scripts/run_native_benchmarks.py scripts/check_benchmark_shards.py
      - run: |
          uv run --no-sync python -c "import subprocess, sys; subprocess.check_call([sys.executable, '-m', 'basedpyright', '--pythonpath', sys.executable])"
      - name: Verify Rust and Python consumers from source distribution
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 20
        shell: bash
        run: |
          staging="$(mktemp -d)"
          uv run --no-sync maturin sdist --out "$staging"
          tar -xzf "$staging"/*.tar.gz -C "$staging"
          cd "$staging"/innovate-*/
          export CARGO_TARGET_DIR="$staging/target"
          cargo test --locked -p innovate-core --test native_boundary --test remote_worker -j 2
          python="$GITHUB_WORKSPACE/.venv/bin/python"
          CARGO_BUILD_JOBS=2 "$GITHUB_WORKSPACE/.venv/bin/maturin" build --locked -i "$python" -o "$staging/wheel"
          uv pip install --python "$python" --no-deps --target "$staging/installed" "$staging"/wheel/*.whl
          PYTHONPATH="$staging/installed" "$python" -m pytest tests/native
      - name: Verify the native remote worker container
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 15
        shell: bash
        run: |
          git archive HEAD Dockerfile Cargo.toml Cargo.lock LICENSE rust |
            docker build --target remote-worker -t innovate-remote-worker:ci -
          test "$(docker image inspect --format '{{.Config.User}}' innovate-remote-worker:ci)" = 65532:65532
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint /bin/sh innovate-remote-worker:ci -ec \
            "test -s /usr/local/share/doc/innovate/LICENSE && ! command -v python && ! command -v python3"
          worker=(docker run --rm -i --network none --read-only --cap-drop ALL innovate-remote-worker:ci)
          "${worker[@]}" --describe |
            jq -e '.result.worker_transport == "stdin_stdout" and .result.max_raw_envelope_bytes == 2000000 and .result.identity_verification == "caller_supplied_context"'
          envelope='{"schema_version":"2.0","context":{"request_id":"ci","tenant_id":"test","principal":"fixture","auth_scope":"kernel:execute"},"kernel_request":{"schema_version":"2.0","operation":"predict_model","model_key":"logistic","payload":{"inputs":{"time":[1]},"parameters":{"L":100,"k":1,"x0":1}}}}'
          printf '%s\n' "$envelope" | "${worker[@]}" |
            jq -e '.result.kernel_response.result.values == [50]'
          printf '%s\n' "$envelope" | jq '.context.auth_scope = "read"' | "${worker[@]}" |
            jq -e '.result.kernel_response.error.code == "unsupported_operation"'
          response="$(mktemp)"
          diagnostic="$(mktemp)"
          for malformed in "{" "{\"context\":{},\"context\":{}}"; do
            status=0
            printf %s "$malformed" | "${worker[@]}" >"$response" 2>"$diagnostic" || status=$?
            test "$status" -eq 1
            test ! -s "$response"
            grep -Fx "invalid remote envelope JSON" "$diagnostic"
          done
      - name: Run scheduled native benchmarks
        id: native-benchmarks
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 20
        run: uv run --no-sync python scripts/run_native_benchmarks.py --policy scheduled --workers 2 --output native-benchmarks.json
      - name: Retain native benchmark results
        if: always() && (steps.native-benchmarks.outcome == 'success' || steps.native-benchmarks.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-benchmarks
          path: native-benchmarks.json
          if-no-files-found: error
      - name: Verify local MPI benchmark shards
        id: mpi-benchmarks
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir mpi-benchmarks
          cp native-benchmarks.json mpi-benchmarks/serial.json
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin
          mpirun --version > mpi-benchmarks/launcher-version.txt
          mpirun -n 2 .venv/bin/python scripts/run_native_benchmarks.py --mpi-shard --policy scheduled --output 'mpi-benchmarks/rank-{rank}.json'
          .venv/bin/python scripts/check_benchmark_shards.py mpi-benchmarks/serial.json mpi-benchmarks/rank-*.json
      - name: Retain MPI benchmark receipts
        if: always() && (steps.mpi-benchmarks.outcome == 'success' || steps.mpi-benchmarks.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mpi-benchmarks
          path: mpi-benchmarks/
          if-no-files-found: error
  lint:
    timeout-minutes: 5
    needs: native-python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the native matrix, including Rust formatting and Python lint
        env:
          RESULT: ${{ needs.native-python.result }}
        run: test "$RESULT" = success

  unit-tests-base:
    timeout-minutes: 5
    # The branch protection context retains its old name. Tests run on 3.15.2.
    name: unit-tests-base (3.15.1)
    needs: native-python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require native Rust and Python tests on every platform
        env:
          RESULT: ${{ needs.native-python.result }}
        run: test "$RESULT" = success

  package:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - run: uv sync --locked --no-install-project --python 3.15.2
      - run: .venv/bin/python -c "import sys; assert sys.version_info[:3] == (3, 15, 2)"
      - name: Build the wheel from the source distribution and validate both
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          bash scripts/build_release_wheel.sh .venv
          .venv/bin/twine check dist/*
          .venv/bin/check-wheel-contents dist/*.whl
          tar -tzf dist/*.tar.gz > "$RUNNER_TEMP/sdist-contents"
          if grep -E '(^|/)([.]ruff_cache|__pycache__|.*[.]pyc)' "$RUNNER_TEMP/sdist-contents"; then
            echo "Generated cache files must not be included in the Python sdist."
            exit 1
          fi

  julia-r:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native-library: libinnovate_ffi.so
          - os: macos-latest
            native-library: libinnovate_ffi.dylib
          - os: windows-latest
            native-library: innovate_ffi.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - run: cargo build --release --locked -p innovate-ffi -j 2
      - name: Stage native library in both bindings
        shell: bash
        env:
          NATIVE_LIBRARY: ${{ matrix.native-library }}
        run: |
          mkdir -p bindings/julia/deps bindings/r/inst/lib
          cp "target/release/$NATIVE_LIBRARY" bindings/julia/deps/
          cp "target/release/$NATIVE_LIBRARY" bindings/r/inst/lib/
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        with:
          version: '1.13'
      - shell: bash
        run: |
          unset INNOVATE_NATIVE_LIBRARY
          julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Check Julia documentation and execute examples
        timeout-minutes: 5
        shell: bash
        env:
          DOCS_RECEIPT_DIR: ${{ runner.temp }}/polyglot-docs
        run: |
          unset INNOVATE_NATIVE_LIBRARY
          julia --project=bindings/julia scripts/check_julia_documentation.jl
          test -s "$DOCS_RECEIPT_DIR/julia-documentation.json"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - shell: bash
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - run: R CMD INSTALL bindings/r
        if: matrix.os != 'macos-latest'
        shell: bash
      - name: Build and install the macOS R binary archive
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          stage="$(mktemp -d)"
          mkdir "$stage/build-lib" "$stage/installed-lib"
          cd "$stage"
          R CMD INSTALL --build -l "$stage/build-lib" "$GITHUB_WORKSPACE/bindings/r"
          R CMD INSTALL -l "$stage/installed-lib" ./innovate.R_*.tgz
          echo "R_LIBS=$stage/installed-lib" >> "$GITHUB_ENV"
      - shell: bash
        run: |
          unset INNOVATE_NATIVE_LIBRARY
          Rscript bindings/r/tests/native.R
      - name: Check R documentation and execute examples
        timeout-minutes: 5
        shell: bash
        env:
          DOCS_RECEIPT_DIR: ${{ runner.temp }}/polyglot-docs
        run: |
          unset INNOVATE_NATIVE_LIBRARY
          Rscript scripts/check_r_documentation.R
          test -s "$DOCS_RECEIPT_DIR/r-documentation.json"
      - name: Upload native documentation execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-documentation-${{ matrix.os }}
          path: ${{ runner.temp }}/polyglot-docs/*.json
          if-no-files-found: warn
      - name: Verify R loads the Windows DLL from a Unicode path
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/innovate-unicode-dll.R" <<'RSCRIPT'
            library(innovate.R)
            source <- system.file("lib", "innovate_ffi.dll", package = "innovate.R", mustWork = TRUE)
            directory <- file.path(tempdir(), "innovate-\u6e2c\u8a66")
            stopifnot(dir.create(directory))
            target <- file.path(directory, basename(source))
            stopifnot(file.copy(source, target))
            Sys.setenv(INNOVATE_NATIVE_LIBRARY = target)
            result <- kernel_predict_model("logistic",
              list(inputs = list(time = 1), parameters = list(L = 100, k = 1, x0 = 1)))
            stopifnot(result[["result"]][["values"]][[1]] == 50)
          RSCRIPT
          Rscript "${RUNNER_TEMP}/innovate-unicode-dll.R"
