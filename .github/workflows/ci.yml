name: CI
permissions:
  contents: read
on:
  push:
    branches: [work, main]
  pull_request:
    branches: [work, main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-native
  cancel-in-progress: true
jobs:
  native-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: uv sync --locked --python 3.15.2
        env:
          CARGO_BUILD_JOBS: '2'
      - run: uv run --no-sync python -c "import sys; assert sys.version_info[:3] == (3, 15, 2)"
      - run: cargo test --locked -p innovate-core -p innovate-tabular -p innovate-ffi -j 2
      - run: uv run --no-sync pytest tests/native
      - run: uv run --no-sync python scripts/check_migration.py
      - run: cargo fmt --all --check
      - run: uv run --no-sync ruff check bindings/python tests/native noxfile.py scripts/check_migration.py scripts/run_native_benchmarks.py scripts/check_benchmark_shards.py
      - run: uv run --no-sync basedpyright
      - name: Verify Rust and Python consumers from source distribution
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          staging="$(mktemp -d)"
          uv run --no-sync maturin sdist --out "$staging"
          tar -xzf "$staging"/*.tar.gz -C "$staging"
          cd "$staging"/innovate-*/
          export CARGO_TARGET_DIR="$staging/target"
          cargo test --locked -p innovate-core --test native_boundary --test remote_worker -j 2
          python="$GITHUB_WORKSPACE/.venv/bin/python"
          CARGO_BUILD_JOBS=2 "$GITHUB_WORKSPACE/.venv/bin/maturin" build --locked -i "$python" -o "$staging/wheel"
          uv pip install --python "$python" --no-deps --target "$staging/installed" "$staging"/wheel/*.whl
          PYTHONPATH="$staging/installed" "$python" -m pytest tests/native
      - name: Verify the native remote worker container
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 15
        shell: bash
        run: |
          git archive HEAD Dockerfile pyproject.toml uv.lock Cargo.toml Cargo.lock README.md LICENSE rust bindings/python |
            docker build --target remote-worker -t innovate-remote-worker:ci -
          worker=(docker run --rm -i --network none --read-only --cap-drop ALL innovate-remote-worker:ci)
          "${worker[@]}" --describe |
            jq -e '.result.worker_transport == "stdin_stdout" and .result.max_raw_envelope_bytes == 2000000'
          envelope='{"schema_version":"2.0","context":{"request_id":"ci","tenant_id":"test","principal":"fixture","auth_scope":"kernel:execute"},"kernel_request":{"schema_version":"2.0","operation":"predict_model","model_key":"logistic","payload":{"inputs":{"time":[1]},"parameters":{"L":100,"k":1,"x0":1}}}}'
          printf '%s\n' "$envelope" | "${worker[@]}" |
            jq -e '.result.kernel_response.result.values == [50]'
          printf '%s\n' "$envelope" | jq '.context.auth_scope = "read"' | "${worker[@]}" |
            jq -e '.result.kernel_response.error.code == "unsupported_operation"'
      - name: Run scheduled native benchmarks
        id: native-benchmarks
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: uv run --no-sync python scripts/run_native_benchmarks.py --policy scheduled --workers 2 --output native-benchmarks.json
      - name: Retain native benchmark results
        if: always() && (steps.native-benchmarks.outcome == 'success' || steps.native-benchmarks.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-benchmarks
          path: native-benchmarks.json
          if-no-files-found: error
      - name: Verify local MPI benchmark shards
        id: mpi-benchmarks
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir mpi-benchmarks
          cp native-benchmarks.json mpi-benchmarks/serial.json
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin
          mpirun --version > mpi-benchmarks/launcher-version.txt
          mpirun -n 2 .venv/bin/python scripts/run_native_benchmarks.py --mpi-shard --policy scheduled --output 'mpi-benchmarks/rank-{rank}.json'
          .venv/bin/python scripts/check_benchmark_shards.py mpi-benchmarks/serial.json mpi-benchmarks/rank-*.json
      - name: Retain MPI benchmark receipts
        if: always() && (steps.mpi-benchmarks.outcome == 'success' || steps.mpi-benchmarks.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mpi-benchmarks
          path: mpi-benchmarks/
          if-no-files-found: error
  julia-r:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native-library: libinnovate_ffi.so
          - os: windows-latest
            native-library: innovate_ffi.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - run: cargo build --locked -p innovate-ffi -j 2
      - name: Stage native library in both bindings
        shell: bash
        env:
          NATIVE_LIBRARY: ${{ matrix.native-library }}
        run: |
          mkdir -p bindings/julia/deps bindings/r/inst/lib
          cp "target/debug/$NATIVE_LIBRARY" bindings/julia/deps/
          cp "target/debug/$NATIVE_LIBRARY" bindings/r/inst/lib/
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: '1.13'
      - shell: bash
        run: julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      - shell: bash
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - run: R CMD INSTALL bindings/r
        shell: bash
      - run: Rscript bindings/r/tests/native.R
      - name: Verify R loads the Windows DLL from a Unicode path
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          Rscript -e '
            library(innovate.R)
            source <- system.file("lib", "innovate_ffi.dll", package = "innovate.R", mustWork = TRUE)
            directory <- file.path(tempdir(), "innovate-\u6e2c\u8a66")
            stopifnot(dir.create(directory))
            target <- file.path(directory, basename(source))
            stopifnot(file.copy(source, target))
            Sys.setenv(INNOVATE_NATIVE_LIBRARY = target)
            result <- kernel_predict_model("logistic",
              list(inputs = list(time = 1), parameters = list(L = 100, k = 1, x0 = 1)))
            stopifnot(result[["result"]][["values"]][[1]] == 50)
          '
