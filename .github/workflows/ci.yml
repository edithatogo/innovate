name: CI

permissions:
  contents: read

on:
  push:
    branches: [work, main]
  pull_request:
    branches: [work, main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-v2
  cancel-in-progress: true

jobs:
  prose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Run Vale
        uses: vale-cli/vale-action@d89dee975228ae261d22c15adcd03578634d429c
        with:
          files: README.md,docs,conductor,specs
          separator: ","
          vale_flags: "--minAlertLevel=suggestion"

  # -----------------------------------------------------------------------
  # Test Matrix
  # -----------------------------------------------------------------------
  unit-tests-base:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        include:
          - python-version: "3.14"
            pytest-extra-args: >-
              --ignore=tests/unit/test_benchmark_runner.py
              --ignore=tests/unit/test_benchmark_suite.py
              --ignore=tests/unit/test_mixture_comprehensive.py
              --ignore=tests/unit/test_network_policy_diffusion.py
              --ignore=tests/unit/test_specific_modules_coverage.py

    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Install package
        run: uv pip install -e .

      - name: Run required unit gate
        run: |
          CI=true uv run --python ${{ matrix.python-version }} python -m pytest tests/unit/ -m "not optional_backend" \
            --ignore=tests/unit/test_bayesian_fitter_robust.py \
            --ignore=tests/unit/test_blackjax_fitter.py \
            --ignore=tests/unit/test_dynamics_competition_direct.py \
            --ignore=tests/unit/test_dynamics_contagion_direct.py \
            --ignore=tests/unit/test_categorization.py \
            --ignore=tests/unit/test_path_dependence.py \
            --ignore=tests/unit/test_preprocess.py \
            --ignore=tests/unit/test_plots_diagnostics.py \
            --ignore=tests/unit/test_plots_network.py \
            --ignore=tests/unit/test_advanced_functionality_comprehensive.py \
            --ignore=tests/unit/test_curve_fitter.py \
            ${{ matrix.pytest-extra-args }} \
            --cov=innovate \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            --tb=short \
            -q
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  optional-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install optional backend dependencies
        run: uv sync --extra jax --extra bayesian

      - name: Install package
        run: uv pip install -e .

      - name: Run optional backend unit gate
        run: |
          CI=true uv run python -m pytest tests/unit/ \
            -m optional_backend \
            --cov=innovate \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            --tb=short \
            -q
        env:
          JAX_PLATFORM_NAME: cpu

  # -----------------------------------------------------------------------
  # Lint & Format
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Validate nox session registry
        run: uv run nox --list

      - name: Verify release version synchronization
        run: uv run python scripts/sync_versions.py --check

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: Validate Python package metadata
        run: uv run twine check dist/*

      - name: Validate Python wheel contents
        run: uv run check-wheel-contents dist/*.whl

      - name: Validate Python sdist excludes generated caches
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)([.]ruff_cache|__pycache__|.*[.]pyc)'; then
            echo "Generated cache files must not be included in the Python sdist."
            exit 1
          fi

  docs-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/astro-site
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: docs/astro-site/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install Python documentation extractor
        run: python -m pip install griffe

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs smoke target
        run: pnpm build

  rust-bindings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy

      - name: Check Rust formatting
        working-directory: bindings/rust
        run: cargo fmt --check

      - name: Run Rust clippy
        working-directory: bindings/rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust binding tests
        working-directory: bindings/rust
        run: cargo test

      - name: Package Rust crate
        working-directory: bindings/rust
        run: |
          # Repo-first Kairos git deps are not crates.io-publishable yet.
          if grep -Eq 'kairo-ecs-.*git = "https://github.com/edithatogo/kairos' Cargo.toml; then
            echo "Skipping cargo package while unpublished Kairos git dependencies are present."
            exit 0
          fi
          cargo package

  rust-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Validate Rust migration inventory
        working-directory: bindings/rust
        run: |
          test -s inst/discovery_manifest.json
          python3 -m json.tool inst/discovery_manifest.json >/tmp/innovate-rs-discovery-manifest.json
          find ../../docs/source/_static \
            -type f \( -name "rust_core_*inventory*.json" -o -name "rust_core_*dossier*.json" \) \
            -print >/tmp/innovate-rs-core-json-files.txt
          test -s /tmp/innovate-rs-core-json-files.txt
          while IFS= read -r file; do
            python3 -m json.tool "$file" >/dev/null
          done </tmp/innovate-rs-core-json-files.txt

      - name: Check Rust benchmark and profiling targets compile
        working-directory: bindings/rust
        run: cargo check --benches --examples

      - name: Check Rust benchmark harness compiles
        working-directory: bindings/rust
        run: cargo bench --bench native_kernel --no-run

      - name: Check Rust memory profiler compiles
        working-directory: bindings/rust
        run: cargo check --example profile_memory_native_kernels

      - name: Validate Rust profiling package contents
        working-directory: bindings/rust
        run: |
          if grep -Eq 'kairo-ecs-.*git = "https://github.com/edithatogo/kairos' Cargo.toml; then
            echo "Validating package include paths from Cargo.toml (cargo package blocked by Kairos git deps)."
            test -f benches/native_kernel.rs
            test -f examples/profile_memory_native_kernels.rs
            test -f inst/discovery_manifest.json
            test -f scripts/profile_native_kernels.sh
            test -f scripts/profile_memory_native_kernels.sh
            exit 0
          fi
          cargo package --list | tee /tmp/innovate-rs-benchmark-package-files.txt
          grep -F "benches/native_kernel.rs" /tmp/innovate-rs-benchmark-package-files.txt
          grep -F "examples/profile_memory_native_kernels.rs" /tmp/innovate-rs-benchmark-package-files.txt
          grep -F "inst/discovery_manifest.json" /tmp/innovate-rs-benchmark-package-files.txt
          grep -F "scripts/profile_native_kernels.sh" /tmp/innovate-rs-benchmark-package-files.txt
          grep -F "scripts/profile_memory_native_kernels.sh" /tmp/innovate-rs-benchmark-package-files.txt

  typescript-bindings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["26"]
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: bindings/typescript
        run: npm ci

      - name: Check TypeScript schema compatibility
        working-directory: bindings/typescript
        run: npm run schema:check

      - name: Type-check TypeScript bindings
        working-directory: bindings/typescript
        run: npm run typecheck

      - name: Run TypeScript binding tests
        working-directory: bindings/typescript
        run: npm test

      - name: Validate npm package contents
        working-directory: bindings/typescript
        run: npm pack --dry-run

  go-bindings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Go binding tests
        working-directory: bindings/go
        run: go test ./...

      - name: Run Go vet
        working-directory: bindings/go
        run: go vet ./...

      - name: Validate Go module path
        working-directory: bindings/go
        run: test "$(go list -m)" = "github.com/edithatogo/innovate/bindings/go"

  julia-bindings:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.julia-version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.12", "nightly"]
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: ${{ matrix.julia-version }}

      - name: Instantiate Julia binding project
        run: julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate()'

      - name: Run Julia binding tests
        run: julia --project=bindings/julia bindings/julia/test/runtests.jl

      - name: Run Julia installed-package smoke
        if: matrix.julia-version == '1.12'
        env:
          INNOVATE_JULIA_RUN_BRIDGE_SMOKE: "true"
          INNOVATE_JULIA_RUN_INSTALLED_PACKAGE_SMOKE: "true"
          INNOVATE_PYTHON_COMMAND: "uv run --directory ${{ github.workspace }} python"
        run: |
          tmpdir="$(mktemp -d)"
          cp -R bindings/julia "$tmpdir/Innovate"
          rm -f "$tmpdir/Innovate/Manifest.toml"
          cd "$tmpdir/Innovate"
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  r-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - name: Set up TinyTeX for R manual PDF
        uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - name: Set up Pandoc for R vignettes
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - name: Install R binding dependencies
        run: |
          Rscript -e 'repos <- Sys.getenv("RSPM", "https://cloud.r-project.org"); packages <- c("jsonlite", "knitr", "rmarkdown"); install.packages(packages, repos = repos); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop("Missing R packages: ", paste(missing, collapse = ", "))'

      - name: Read R package metadata
        id: r_metadata
        run: |
          Rscript -e 'd <- read.dcf("bindings/r/DESCRIPTION")[1, ]; cat("package=", d[["Package"]], "\nversion=", d[["Version"]], "\n", sep = "")' >> "$GITHUB_OUTPUT"

      - name: Run R binding tests
        env:
          INNOVATE_RUN_INTEGRATION_TESTS: "true"
        run: Rscript bindings/r/tests/run.R

      - name: Build R source package
        run: R CMD build bindings/r

      - name: Build R manual PDF
        run: |
          mkdir -p artifacts/r-manual
          R CMD Rd2pdf --no-preview \
            --output="artifacts/r-manual/${{ steps.r_metadata.outputs.package }}_${{ steps.r_metadata.outputs.version }}_manual.pdf" \
            bindings/r
          test -s "artifacts/r-manual/${{ steps.r_metadata.outputs.package }}_${{ steps.r_metadata.outputs.version }}_manual.pdf"

      - name: Upload R manual PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r-manual-${{ steps.r_metadata.outputs.package }}-${{ steps.r_metadata.outputs.version }}
          path: artifacts/r-manual/${{ steps.r_metadata.outputs.package }}_${{ steps.r_metadata.outputs.version }}_manual.pdf

      - name: Check R source package
        run: R CMD check --as-cran --no-manual innovate.R_*.tar.gz

  csharp-bindings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: "10.0.x"
            target-framework: "net10.0"
          - dotnet-version: "11.0.x"
            target-framework: "net11.0"
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Python dependencies
        run: uv sync

      - name: Set up .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore C# binding dependencies
        run: dotnet restore bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj -p:TargetFrameworks=${{ matrix.target-framework }}

      - name: Test C# bindings
        run: dotnet test bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj --configuration Release --framework ${{ matrix.target-framework }} -p:TargetFrameworks=${{ matrix.target-framework }}

      - name: Pack C# binding
        run: dotnet pack bindings/csharp/Innovate.Kernel/Innovate.Kernel.csproj --configuration Release --output bindings/csharp/artifacts/${{ matrix.target-framework }} -p:TargetFrameworks=${{ matrix.target-framework }} -p:ContinuousIntegrationBuild=true

  # -----------------------------------------------------------------------
  # Type Checking
  # -----------------------------------------------------------------------
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run basedpyright strict (verified public API surface)
        run: |
          uv run basedpyright --warnings \
            src/innovate/__init__.py \
            src/innovate/backend.py \
            src/innovate/backends/__init__.py \
            src/innovate/capabilities.py \
            src/innovate/diffuse/__init__.py \
            src/innovate/substitute/__init__.py \
            src/innovate/ecosystem/__init__.py

  # -----------------------------------------------------------------------
  # Optional Extended Suites
  # -----------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Run integration tests
        run: CI=true uv run python -m pytest tests/integration/ -m integration --tb=short -q
        env:
          JAX_PLATFORM_NAME: cpu

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Run e2e tests
        run: CI=true uv run python -m pytest tests/e2e/ -m e2e --tb=short -q
        env:
          JAX_PLATFORM_NAME: cpu

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run Bandit security scan
        run: uv run bandit -r src/innovate -c pyproject.toml

      - name: Run Safety vulnerability scan
        run: uv run safety check

  # -----------------------------------------------------------------------
  # Benchmarks (optional, triggered on demand)
  # -----------------------------------------------------------------------
  benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra jax

      - name: Install package
        run: uv pip install -e .

      - name: Run Scalene profiling
        run: uv run scalene src/innovate --cli --reduced-profile

      - name: Run pytest benchmarks
        run: uv run pytest --benchmark-only --benchmark-json=benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-results
          path: benchmark.json

  # -----------------------------------------------------------------------
  # Mutation Testing (weekly schedule)
  # -----------------------------------------------------------------------
  mutation-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Install package
        run: uv pip install -e .

      - name: Run mutmut
        run: uv run mutmut run
        env:
          JAX_PLATFORM_NAME: cpu

      - name: Show mutmut results
        run: uv run mutmut results
