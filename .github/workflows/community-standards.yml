name: Community standards

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community-standards:
    name: community-standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Audit community standards
        uses: edithatogo/repository-standards/.github/actions/community-standards@5b6741ac12f3720834ff8605eeb603fc15f7e683
