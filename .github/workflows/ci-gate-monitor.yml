name: CI Gate Monitor

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI", "Release Please"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  monitor:
    if: ${{ contains(fromJSON('["failure", "success"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing failure issue
        id: incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            const title = `🚨 ${run.name} failed on ${branch}`;
            const repository = `${owner}/${repo}`.toLowerCase();

            if (!branch) {
              core.info('Run has no branch; leaving failure issues unchanged.');
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              labels: ['ci-failure'],
              state: 'open'
            });

            const existingIssue = issues.find(issue =>
              !issue.pull_request && issue.title === title
            );

            if (run.conclusion === 'success' && !existingIssue) return;

            const latestRuns = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: run.workflow_id,
              branch,
              event: run.event,
              per_page: 1
            });
            const latest = latestRuns.data.workflow_runs[0];
            const sameOrigin = candidate =>
              candidate?.head_repository?.full_name?.toLowerCase() === repository;
            const sameScope = candidate => sameOrigin(candidate) &&
              candidate.workflow_id === run.workflow_id &&
              candidate.head_branch === branch && candidate.event === run.event;
            const isCurrent = latest?.id === run.id &&
              latest?.run_attempt === run.run_attempt;

            if (run.conclusion === 'success') {
              // A newer success must match the incident's workflow, branch,
              // event and repository before any issue may be closed.
              if (!sameScope(run) || !sameScope(latest) || !isCurrent ||
                  latest.status !== 'completed' || latest.conclusion !== 'success' ||
                  !Number.isInteger(existingIssue.comments) || existingIssue.comments < 0) return;

              const recoveryStarted = Date.parse(latest.run_started_at);
              if (!Number.isFinite(recoveryStarted)) return;

              const original = existingIssue.body?.match(
                /^- \*\*Run URL:\*\* .*\/actions\/runs\/(\d+)\s*$/m
              );
              if (!original) return;
              const reportedRuns = new Set([Number(original[1])]);

              if (existingIssue.comments > 0) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: existingIssue.number
                });
                if (comments.length !== existingIssue.comments) return;
                const prefix = `**CI Failure Detected Again**\n\n- Workflow: ${run.name}\n- Branch: ${branch}\n- Run: `;
                for (const comment of comments) {
                  if (comment.user?.login !== 'github-actions[bot]' ||
                      comment.user?.type !== 'Bot' || !comment.body?.startsWith(prefix)) return;
                  const report = comment.body.slice(prefix.length).match(
                    /^(https:\/\/[^\s]+\/actions\/runs\/(\d+))\n- Conclusion: failure(?:\n|$)/
                  );
                  if (!report) return;
                  let url;
                  let runUrl;
                  try {
                    url = new URL(report[1]);
                    runUrl = new URL(run.html_url);
                  } catch {
                    return;
                  }
                  if (url.origin !== runUrl.origin ||
                      url.pathname.toLowerCase() !== `/${owner}/${repo}/actions/runs/${report[2]}`.toLowerCase() ||
                      url.search || url.hash) return;
                  reportedRuns.add(Number(report[2]));
                }
              }

              for (const runId of reportedRuns) {
                let reported;
                try {
                  reported = (await github.rest.actions.getWorkflowRun({
                    owner, repo, run_id: runId
                  })).data;
                } catch (error) {
                  if (error.status !== 404) throw error;
                  core.info('Reported run is unavailable; leaving the issue open.');
                  return;
                }
                if (!sameScope(reported) || reported.status !== 'completed') return;
                if (reported.id === latest.id) {
                  if (reported.run_attempt !== latest.run_attempt || reported.conclusion !== 'success') return;
                } else {
                  const reportedFinished = Date.parse(reported.updated_at);
                  if (!Number.isFinite(reportedFinished) || reportedFinished > recoveryStarted) return;
                }
              }

              await github.rest.issues.update({
                owner, repo, issue_number: existingIssue.number,
                state: 'closed', state_reason: 'completed'
              });
              core.info(`Closed recovered issue #${existingIssue.number}`);
              return;
            }

            // Completion events may arrive out of order. A newer successful run
            // supersedes this failure only if it started after the failure ended.
            const failureFinished = Date.parse(run.updated_at);
            const latestStarted = Date.parse(latest?.run_started_at);
            if (!isCurrent && sameScope(run) && sameScope(latest) &&
                latest?.status === 'completed' && latest?.conclusion === 'success' &&
                Number.isFinite(failureFinished) && Number.isFinite(latestStarted) &&
                failureFinished <= latestStarted) {
              core.setOutput('superseded', 'true');
              return;
            }

            if (existingIssue) {
              // Add a comment to the existing issue
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existingIssue.number,
                body: `**CI Failure Detected Again**\n\n- Workflow: ${run.name}\n- Branch: ${branch}\n- Run: ${run.html_url}\n- Conclusion: ${run.conclusion}\n\n@${run.head_commit?.author?.username || 'maintainer'} — please investigate.`
              });
              core.info(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create a new issue
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: `## CI Failure Report\n\n- **Workflow:** ${run.name}\n- **Branch:** ${branch}\n- **Run URL:** ${run.html_url}\n- **Conclusion:** ${run.conclusion}\n- **Triggered by:** ${run.event}\n\n### Next Steps\n1. Check the [workflow run logs](${run.html_url})\n2. Identify the failing job\n3. Fix the issue and push a new commit\n\ncc: @${run.head_commit?.author?.username || 'maintainer'}`,
                labels: ['ci-failure', 'bug']
              });
              core.info(`Created issue #${issue.number}`);
            }

      - name: Post PR comment if applicable
        if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0] && steps.incident.outputs.superseded != 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.workflow_run.pull_requests[0];
            const run = context.payload.workflow_run;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: `⚠️ **CI Check Failed**\n\nThe \`${run.name}\` workflow has failed.\n\n[View run logs](${run.html_url})\n\nPlease investigate and fix the failure.`
            });
