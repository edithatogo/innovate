# Shared repository privacy baseline. Application dependencies are unchanged.
# Documentation: https://github.com/edithatogo/repository-standards/blob/main/docs/privacy-secrets-standard.md
# The shared action builds isolated Python 3.15.2-compatible Presidio wheels.
# Existing repository-specific privacy and secret checks remain independent.
name: Privacy and secrets

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '36 4 * * 5'
  workflow_dispatch:
    inputs:
      profile:
        description: Personal-identifier detection profile
        type: choice
        options:
          - repository
          - sensitive
        default: repository

permissions:
  contents: read

concurrency:
  group: privacy-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Scan with Presidio and Gitleaks
        uses: edithatogo/repository-standards/.github/actions/privacy-secrets@c82b2658f6874127d05f825dbe9ed4747f146efd
        with:
          profile: ${{ inputs.profile || 'repository' }}

