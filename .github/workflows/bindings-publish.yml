name: Publish Language Bindings

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run packaging checks without publishing"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  id-token: write

jobs:
  npm-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - run: npm ci
      - run: npm run schema:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish to npm
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  crates-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo package
      - name: Validate crate package contents
        run: |
          cargo package --list | tee /tmp/innovate-rs-package-files.txt
          grep -F "Cargo.toml" /tmp/innovate-rs-package-files.txt
          grep -F "README.md" /tmp/innovate-rs-package-files.txt
          grep -F "src/lib.rs" /tmp/innovate-rs-package-files.txt
          grep -F "inst/python/kernel_bridge.py" /tmp/innovate-rs-package-files.txt
      - name: Publish to crates.io
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  r-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("jsonlite"), repos = "https://cloud.r-project.org")'
      - run: R CMD build bindings/r
      - run: R CMD check --as-cran --no-manual innovate.R_*.tar.gz
      - name: Upload R package artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-package-source
          path: innovate.R_*.tar.gz
      - name: R-universe and CRAN publication gate
        run: |
          echo "R-universe publication is driven by the configured universe registry."
          echo "CRAN submission remains a manual maintainer release step after R CMD check --as-cran passes."

  julia-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Validate Julia registry metadata
        run: |
          grep -F 'name = "Innovate"' bindings/julia/Project.toml
          grep -F 'uuid = "ffe8f1e4-c541-43d5-9f32-550aacc4f51a"' bindings/julia/Project.toml
          grep -F 'version = "0.5.0"' bindings/julia/Project.toml
          grep -F 'JSON = "0.21"' bindings/julia/Project.toml
      - name: Julia General registry publication is planned
        run: |
          echo "Use '@JuliaRegistrator register subdir=bindings/julia' after the Python backend dependency path is packaged."
          echo "A dedicated Innovate.jl repository may be needed for Julia General AutoMerge; otherwise expect manual review."

  go-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
      - run: go test ./...
      - run: go list -m
      - name: Validate Go module release tag pattern
        run: |
          test "$(go list -m)" = "github.com/edithatogo/innovate/bindings/go"
          case "${GITHUB_REF_NAME:-v0.0.0}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must look like vX.Y.Z"; exit 1 ;;
          esac
          echo "Go releases use tags like bindings/go/${GITHUB_REF_NAME} for the submodule."
      - name: Tag Go submodule release
        if: ${{ github.event_name == 'release' }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go_tag="bindings/go/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${go_tag}" >/dev/null 2>&1; then
            existing="$(git ls-remote --tags origin "refs/tags/${go_tag}" | awk '{print $1}')"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Go submodule tag ${go_tag} points at ${existing}, want ${GITHUB_SHA}."
              exit 1
            fi
            echo "Go submodule tag ${go_tag} already exists at the release commit."
            exit 0
          fi
          git tag "$go_tag" "$GITHUB_SHA"
          git push origin "$go_tag"

      - name: Validate Go module through direct VCS and public proxy
        if: ${{ github.event_name == 'release' }}
        working-directory: bindings/go
        run: |
          module="github.com/edithatogo/innovate/bindings/go"
          version="${GITHUB_REF_NAME}"
          GOPROXY=direct GOSUMDB=sum.golang.org go list -m -json "${module}@${version}"
          for attempt in 1 2 3 4 5; do
            echo "Validating ${module}@${version} through proxy attempt ${attempt}."
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -m -json "${module}@${version}" && exit 0
            sleep 30
          done
          exit 1

  nuget-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.12
      - run: uv sync
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet restore bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj
      - run: dotnet test bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj --configuration Release --framework net10.0 -p:TargetFrameworks=net10.0
      - run: dotnet test bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj --configuration Release --framework net11.0 -p:TargetFrameworks=net11.0
      - run: dotnet pack bindings/csharp/Innovate.Kernel/Innovate.Kernel.csproj --configuration Release --output bindings/csharp/artifacts -p:ContinuousIntegrationBuild=true
      - name: Validate NuGet package artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(bindings/csharp/artifacts/*.nupkg)
          symbols=(bindings/csharp/artifacts/*.snupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one NuGet package, found ${#packages[@]}."
            exit 1
          fi
          if [ "${#symbols[@]}" -ne 1 ]; then
            echo "Expected exactly one NuGet symbol package, found ${#symbols[@]}."
            exit 1
          fi

          package="${packages[0]}"
          unzip -l "$package"
          unzip -p "$package" "innovate.cs.nuspec" | tee /tmp/innovate-kernel.nuspec

          grep -F "<license type=\"expression\">Apache-2.0</license>" /tmp/innovate-kernel.nuspec
          grep -F "<repository type=\"git\" url=\"https://github.com/edithatogo/innovate\"" /tmp/innovate-kernel.nuspec
          grep -F "<tags>innovate health-economics decision-analysis kernel bindings</tags>" /tmp/innovate-kernel.nuspec
          unzip -l "$package" | grep -F "README.md"
          unzip -l "$package" | grep -F "contentFiles/any/any/innovate/kernel_bridge.py"
          unzip -l "$package" | grep -F "lib/net10.0/Innovate.Kernel.dll"
          unzip -l "$package" | grep -F "lib/net11.0/Innovate.Kernel.dll"
          unzip -l "$package" | grep -F "lib/net10.0/Innovate.Kernel.xml"
          unzip -l "$package" | grep -F "lib/net11.0/Innovate.Kernel.xml"

          symbol="${symbols[0]}"
          unzip -l "$symbol" | grep -F "lib/net10.0/Innovate.Kernel.pdb"
          unzip -l "$symbol" | grep -F "lib/net11.0/Innovate.Kernel.pdb"
      - name: Publish to NuGet
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in bindings/csharp/artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
