name: Publish Language Bindings

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run packaging checks without publishing"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  id-token: write

jobs:
  npm-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish to npm
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  crates-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo package --allow-dirty
      - name: Publish to crates.io
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

  r-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("jsonlite"), repos = "https://cloud.r-project.org")'
      - run: R CMD build bindings/r
      - run: R CMD check --no-manual innovate_*.tar.gz

  julia-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Julia General registry publication is planned
        run: |
          echo "Use Julia Registrator/General registry after package ownership and compatibility bounds are finalized."

  go-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
      - run: go test ./...
      - run: go list -m

  nuget-csharp-planned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"
      - name: NuGet publication is planned
        run: |
          test ! -d bindings/csharp || dotnet test bindings/csharp
