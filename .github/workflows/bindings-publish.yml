name: Native Binding Release Gate
permissions:
  contents: read
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - run: uv venv .venv-release --python 3.15.2
      - name: Require complete native scientific migration
        run: .venv-release/bin/python scripts/check_migration.py --release
      - name: Require separately qualified native package publication
        run: |
          echo "Julia/R native distribution and Rust publication qualification remain open."
          exit 1

  ffi-sbom-and-provenance:
    name: Package FFI archive, SBOM, and SLSA provenance
    needs: release-readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.100.0
      - name: Build FFI shared library and package archive
        run: |
          cargo build --release --locked -p innovate-ffi
          mkdir -p dist-ffi sbom-input
          cp target/release/libinnovate_ffi.so dist-ffi/
          cp target/release/libinnovate_ffi.so Cargo.lock sbom-input/
          tar -czf innovate-ffi-linux-x86_64.tar.gz -C dist-ffi .
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-input
          format: spdx-json
          output-file: innovate-ffi-sbom.spdx.json
          upload-release-assets: false
      - name: Verify Rust packages in generated SBOM
        run: jq -e '.packages | any(.name == "innovate-ffi")' innovate-ffi-sbom.spdx.json > /dev/null
      - name: Scan FFI archive and Rust lockfile with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: sbom-input
          fail-build: true
          severity-cutoff: critical
      - name: Attest SLSA build provenance (Sigstore / in-toto)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: innovate-ffi-linux-x86_64.tar.gz
      - name: Upload FFI archive and SPDX SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: innovate-ffi-linux-x86_64
          path: |
            innovate-ffi-linux-x86_64.tar.gz
            innovate-ffi-sbom.spdx.json
          if-no-files-found: error
