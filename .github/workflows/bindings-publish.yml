name: Publish Language Bindings

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run packaging checks without publishing"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  id-token: write

jobs:
  npm-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish to npm
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  crates-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo package --allow-dirty
      - name: Publish to crates.io
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

  r-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("jsonlite"), repos = "https://cloud.r-project.org")'
      - run: R CMD build bindings/r
      - run: R CMD check --no-manual innovate_*.tar.gz
      - name: Upload R package artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-package-source
          path: innovate_*.tar.gz
      - name: R-universe and CRAN publication gate
        run: |
          echo "R-universe publication is driven by the configured universe registry."
          echo "CRAN submission remains a manual maintainer release step after R CMD check passes."

  julia-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: julia --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Julia General registry publication is planned
        run: |
          echo "Use Julia Registrator/General registry after package ownership and compatibility bounds are finalized."

  go-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
      - run: go test ./...
      - run: go list -m
      - name: Tag Go submodule release
        if: ${{ github.event_name == 'release' }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go_tag="bindings/go/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${go_tag}" >/dev/null 2>&1; then
            echo "Go submodule tag ${go_tag} already exists."
            exit 0
          fi
          git tag "$go_tag" "$GITHUB_SHA"
          git push origin "$go_tag"

  nuget-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.12
      - run: uv sync
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"
      - run: dotnet restore bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj
      - run: dotnet test bindings/csharp/Innovate.Kernel.Tests/Innovate.Kernel.Tests.csproj --configuration Release --no-restore
      - run: dotnet pack bindings/csharp/Innovate.Kernel/Innovate.Kernel.csproj --configuration Release --output bindings/csharp/artifacts
      - name: Publish to NuGet
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in bindings/csharp/artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
