name: Native Binding Release Gate
permissions:
  contents: read
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - run: uv venv .venv-release --python 3.15.2
      - name: Require complete native scientific migration
        run: .venv-release/bin/python scripts/check_migration.py --release
      - name: Require separately qualified native package publication
        run: |
          echo "Julia/R native distribution and Rust publication qualification remain open."
          exit 1
