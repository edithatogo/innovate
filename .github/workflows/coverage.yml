name: Coverage

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage:
    name: Rust line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - name: Install the pinned native coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Run instrumented native tests
        run: |
          mkdir -p coverage
          git rev-parse HEAD > coverage/source-commit.txt
          cargo llvm-cov --locked -p innovate-core -p innovate-tabular -p innovate-ffi -j 2 --no-report
      - name: Generate the native line report
        id: report
        run: |
          # The pinned tool excludes tests/examples/benches and *_tests.rs.
          # Inline unit-test modules remain in their source files' denominator.
          cargo llvm-cov report -p innovate-core -p innovate-tabular -p innovate-ffi --lcov --output-path coverage/rust.lcov
          test -s coverage/rust.lcov
          grep -qF 'rust/crates/innovate-core/src/' coverage/rust.lcov
          grep -qF 'rust/crates/innovate-tabular/src/' coverage/rust.lcov
          grep -qF 'rust/crates/innovate-ffi/src/' coverage/rust.lcov
          grep -qE '^LH:[1-9][0-9]*$' coverage/rust.lcov
      - name: Enforce the native line-coverage floor
        run: cargo llvm-cov report -p innovate-core -p innovate-tabular -p innovate-ffi --fail-under-lines 80
      - name: Upload native line coverage with OIDC
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.2
          use_oidc: true
          files: coverage/rust.lcov
          flags: rust-native
          name: rust-native
          disable_search: true
          fail_ci_if_error: true
      - name: Retain the native coverage evidence
        if: ${{ !cancelled() && hashFiles('coverage/*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-line-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  python-coverage:
    name: Python binding line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - run: uv sync --locked --python 3.15.2
      - run: uv run --no-sync python -c "import sys; assert sys.version_info[:3] == (3, 15, 2)"
      - name: Verify the measured binding source
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import innovate

          assert Path(innovate.__file__).resolve() == Path('bindings/python/innovate/__init__.py').resolve()
          PY
      - name: Measure the Python binding through native consumer tests
        id: tests
        run: |
          mkdir -p coverage
          git rev-parse HEAD > coverage/source-commit.txt
          uv run --no-sync pytest tests/native --cov=bindings/python/innovate --cov-report=term-missing --cov-report=xml:coverage/python.xml
      - name: Validate the binding report
        id: report
        run: |
          test -s coverage/python.xml
          uv run --no-sync python - <<'PY'
          from xml.etree import ElementTree

          report = ElementTree.parse('coverage/python.xml').getroot()
          assert int(report.attrib['lines-valid']) > 0, 'No Python lines measured'
          assert int(report.attrib['lines-covered']) > 0, 'No Python lines executed'
          PY
      - name: Enforce the binding line-coverage floor
        run: uv run --no-sync coverage report --fail-under=80
      - name: Upload Python binding line coverage with OIDC
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.2
          use_oidc: true
          files: coverage/python.xml
          flags: python-binding
          name: python-binding
          disable_search: true
          fail_ci_if_error: true
      - name: Retain the Python binding coverage evidence
        if: ${{ !cancelled() && hashFiles('coverage/*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-binding-line-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
