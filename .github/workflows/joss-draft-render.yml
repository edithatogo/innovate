name: Official Inara JOSS working-draft render

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/joss-draft-render.yml
      - conductor/tracks/research_software_registry_readiness_20260721/joss/**
      - scripts/check_joss_readiness.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joss-draft-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  official-draft:
    name: Pinned Inara draft PDF and page images
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout reviewed source without retaining credentials
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Verify the unapproved manuscript edition before rendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/joss-render"
          python3 scripts/check_joss_readiness.py --json | tee "$RUNNER_TEMP/joss-render/preflight.json"

      - name: Obtain and identify exact official Inara template
        shell: bash
        run: |
          set -euo pipefail
          inara="$RUNNER_TEMP/joss-render/inara"
          git init --quiet "$inara"
          git -C "$inara" fetch --depth=1 https://github.com/openjournals/inara.git 88ee5d656f147d801448ce77ad8375619d383df6
          git -C "$inara" checkout --detach FETCH_HEAD
          git -C "$inara" rev-parse HEAD | tee "$RUNNER_TEMP/joss-render/inara-head.txt"
          test "$(git -C "$inara" rev-parse HEAD)" = "88ee5d656f147d801448ce77ad8375619d383df6"
          test -z "$(git -C "$inara" status --porcelain)"

      - name: Build the unchanged official template container
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joss-render"
          # BuildKit may not load the base tag into the host image store.
          # Pull first, record the resolved digest, and build without repulling.
          docker pull pandoc/latex:3.6.4-alpine > "$root/base-pull.log" 2>&1
          docker image inspect --format '{{json .RepoDigests}}' pandoc/latex:3.6.4-alpine > "$root/base-image-digests.json"
          if ! docker build --pull=false --tag innovate-joss-inara:pinned "$root/inara" > "$root/docker-build.log" 2>&1; then
            tail -n 100 "$root/docker-build.log"
            exit 1
          fi
          docker image inspect --format '{{json .Id}}' innovate-joss-inara:pinned > "$root/render-image-id.json"

      - name: Execute pinned official draft render and rasterize pages
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joss-render"
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace/innovate,readonly" \
            --mount "type=bind,src=$root/inara,dst=/workspace/inara" \
            --mount "type=bind,src=$root,dst=/workspace/receipts" \
            --workdir /workspace/innovate \
            innovate-joss-inara:pinned -ec '
              apk add --no-cache python3 git make poppler-utils > /workspace/receipts/runtime-packages.log 2>&1
              git config --global --add safe.directory /workspace/inara
              git config --global --add safe.directory /workspace/innovate
              python3 /workspace/innovate/conductor/tracks/research_software_registry_readiness_20260721/joss/render.py \
                --inara /workspace/inara \
                --output-dir /workspace/receipts/draft \
                --pandoc "$(command -v pandoc)" \
                --source-date-epoch 1794960000
              pdfinfo /workspace/receipts/draft/paper.pdf > /workspace/receipts/pdfinfo.txt
              pdftotext -layout /workspace/receipts/draft/paper.pdf /workspace/receipts/paper-text.txt
              mkdir -p /workspace/receipts/pages
              pdftoppm -r 120 -png /workspace/receipts/draft/paper.pdf /workspace/receipts/pages/page
            '

      - name: Verify actual PDF, PDF-page coverage and draft-only receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "joss-render"
          receipt = json.loads((root / "draft" / "receipt.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "rendered_draft_visual_review_pending"
          assert receipt["submission_ready"] is False
          assert receipt["visual_review"] == "not_performed"
          assert receipt["inara"]["revision"] == "88ee5d656f147d801448ce77ad8375619d383df6"
          assert receipt["software_revision"] == "20fe0b41b815bc926fc3d61b9672c3d4b2feb289"
          assert all(receipt["checks"][stage]["status"] == "passed" for stage in
                     ("source_integrity", "bibtex_parse", "official_tex", "official_pdf"))
          for name in ("paper.tex", "paper.pdf", "bibliography.json", "render.log"):
              path = root / "draft" / name
              assert path.is_file() and path.stat().st_size > 0, name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == receipt["output_sha256"][name], name
          info = (root / "pdfinfo.txt").read_text(encoding="utf-8")
          matches = re.search(r"^Pages:\s*(\d+)\s*$", info, flags=re.MULTILINE)
          assert matches is not None
          count = int(matches.group(1))
          pages = sorted((root / "pages").glob("page-*.png"))
          assert 1 <= count <= 8 and len(pages) == count, (count, len(pages))
          extracted = (root / "paper-text.txt").read_text(encoding="utf-8")
          assert "not author-approved" in extracted
          assert receipt["software_revision"] in extracted
          summary = {
              "schema_version": 1,
              "state": "official_draft_rendered_visual_review_pending",
              "pdf_pages": count,
              "rendered_page_images": [page.name for page in pages],
              "pdf_sha256": receipt["output_sha256"]["paper.pdf"],
              "software_revision": receipt["software_revision"],
              "scientific_or_release_qualification": False,
              "submission_ready": False,
              "visual_review": "not_performed",
              "limits": "No human page-by-page or assistive-technology review; no author approval or journal submission."
          }
          (root / "render-verification.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Retain original build failures, draft output and rasterized pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joss-unapproved-draft-${{ github.sha }}
          path: |
            ${{ runner.temp }}/joss-render/preflight.json
            ${{ runner.temp }}/joss-render/inara-head.txt
            ${{ runner.temp }}/joss-render/base-image-digests.json
            ${{ runner.temp }}/joss-render/render-image-id.json
            ${{ runner.temp }}/joss-render/runtime-packages.log
            ${{ runner.temp }}/joss-render/base-pull.log
            ${{ runner.temp }}/joss-render/docker-build.log
            ${{ runner.temp }}/joss-render/pdfinfo.txt
            ${{ runner.temp }}/joss-render/paper-text.txt
            ${{ runner.temp }}/joss-render/render-verification.json
            ${{ runner.temp }}/joss-render/draft/
            ${{ runner.temp }}/joss-render/pages/
          if-no-files-found: warn
