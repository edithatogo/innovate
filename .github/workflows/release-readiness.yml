name: Release Readiness

permissions:
  contents: read

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Select isolated release checker
        run: uv venv .venv-release --python 3.15.2

      - name: Check native migration policy
        run: .venv-release/bin/python scripts/check_migration.py --release

  release-lane-checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - run: uv venv .venv-release --python 3.15.2
      - run: UV_PROJECT_ENVIRONMENT=.venv-release uv sync --locked --no-install-project --python .venv-release/bin/python
      - name: Verify release policy and wheel SBOM normalization
        run: .venv-release/bin/python -m pytest tests/unit/test_normalize_wheel_sbom.py tests/native/test_migration_policy.py
      - name: Validate release packaging without publishing
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          source_digest="$(.venv-release/bin/python scripts/check_migration.py --source-digest)"
          bash scripts/build_release_wheel.sh
          .venv-release/bin/twine check dist/*
          .venv-release/bin/check-wheel-contents dist/*.whl
          test "$(.venv-release/bin/python scripts/check_migration.py --source-digest)" = "$source_digest"
          printf "%s\n" "$source_digest" > dist/SOURCE_SHA256
          (cd dist && sha256sum ./*.tar.gz ./*.whl > SHA256SUMS)
      - name: Exercise the release wheel
        run: |
          staging="$(mktemp -d)"
          uv venv "$staging" --python .venv-release/bin/python
          uv pip install --python "$staging/bin/python" dist/*.whl pytest==9.2.0
          uv pip check --python "$staging/bin/python"
          "$staging/bin/python" - "$staging" <<'PYTHON'
          import sys
          from pathlib import Path

          import innovate
          from innovate import _native

          root = Path(sys.argv[1]).resolve()
          for module in (innovate, _native):
              assert Path(module.__file__).resolve().is_relative_to(root), module.__file__
          PYTHON
          "$staging/bin/python" -m pytest -q \
            tests/native/test_python_consumer.py \
            tests/native/test_competition.py \
            tests/native/test_multi_generation.py \
            tests/native/test_paired_outcomes.py
      - name: Retain validated dry-run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-release-dry-run-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
            dist/SOURCE_SHA256
          if-no-files-found: error
      - name: Qualify the installed Voiage consumer
        run: |
          consumer="$(mktemp -d)"
          uv venv "$consumer" --python .venv-release/bin/python
          uv pip install --only-binary :all: --python "$consumer/bin/python" dist/*.whl voiage==3.1.0
          uv pip check --python "$consumer/bin/python"
          "$consumer/bin/python" scripts/qualify_voiage_arrow.py --wheel dist/*.whl > dist/voiage-qualification.json
      - name: Retain Voiage qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voiage-qualification-${{ github.sha }}
          path: dist/voiage-qualification.json
          if-no-files-found: error
