name: Release Readiness

permissions:
  contents: read

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Select isolated release checker
        run: uv venv .venv-release --python 3.15.2

      - name: Require complete native migration
        run: .venv-release/bin/python scripts/check_migration.py --release

  release-lane-checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Document scheduled or manual release lane
        run: |
          printf '%s\n' \
            'This scheduled or manual release lane owns expensive checks.' \
            'Mutation sampling, package dry-runs, compatibility sweeps, and external audit refreshes stay out of fast PR checks.'

      - name: Upload release lane note
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-lane-checks
          path: .github/workflows/release-readiness.yml
