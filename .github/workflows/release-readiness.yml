name: Release Readiness

permissions:
  contents: read

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Select isolated release checker
        run: uv venv .venv-release --python 3.15.2

      - name: Require complete native migration
        run: .venv-release/bin/python scripts/check_migration.py --release

  release-lane-checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - run: uv venv .venv-release --python 3.15.2
      - run: UV_PROJECT_ENVIRONMENT=.venv-release uv sync --locked --no-install-project --python .venv-release/bin/python
      - name: Validate release packaging without publishing
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          bash scripts/build_release_wheel.sh
          .venv-release/bin/twine check dist/*
          .venv-release/bin/check-wheel-contents dist/*.whl
          (cd dist && sha256sum ./*.tar.gz ./*.whl > SHA256SUMS)
      - name: Exercise the release wheel
        run: |
          staging="$(mktemp -d)"
          uv pip install --python .venv-release/bin/python --no-deps --target "$staging" dist/*.whl
          PYTHONPATH="$staging" .venv-release/bin/python - "$staging" <<'PYTHON'
          import sys
          from pathlib import Path

          import innovate
          from innovate import _native

          root = Path(sys.argv[1]).resolve()
          for module in (innovate, _native):
              assert Path(module.__file__).resolve().is_relative_to(root), module.__file__
          PYTHON
          PYTHONPATH="$staging" .venv-release/bin/python -m pytest -q \
            tests/native/test_python_consumer.py::test_native_polars_prediction_and_row_identity
      - name: Retain validated dry-run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-release-dry-run-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
