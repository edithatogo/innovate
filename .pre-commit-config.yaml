# All Python hooks share the explicitly selected repo-local Python 3.15.2.
# This configuration does not install hooks or replace an environment.
repos:
  - repo: local
    hooks:
      - id: check-yaml
        name: Check YAML
        language: system
        entry: bash scripts/run_python_tool.sh pre_commit_hooks.check_yaml
        types: [yaml]
        exclude: ^conda.recipe/meta.yaml$
      - id: check-toml
        name: Check TOML
        language: system
        entry: bash scripts/run_python_tool.sh pre_commit_hooks.check_toml
        types: [toml]
      - id: check-merge-conflict
        name: Check merge conflicts
        language: system
        entry: bash scripts/run_python_tool.sh pre_commit_hooks.check_merge_conflict
        types: [text]
      - id: check-added-large-files
        name: Check large files
        language: system
        entry: bash scripts/run_python_tool.sh pre_commit_hooks.check_added_large_files --maxkb=1000
      - id: end-of-file-fixer
        name: End of file
        language: system
        entry: bash scripts/run_python_tool.sh pre_commit_hooks.end_of_file_fixer
        types: [text]
      - id: trailing-whitespace
        name: Trailing whitespace
        language: system
        entry: bash scripts/run_python_tool.sh pre_commit_hooks.trailing_whitespace_fixer
        types: [text]
      - id: ruff-check
        name: Ruff
        language: system
        entry: bash scripts/run_python_tool.sh ruff check
        types_or: [python, pyi]
        files: ^(bindings/python/|tests/native/|noxfile.py$|scripts/check_migration.py$)
      - id: ruff-format
        name: Ruff format
        language: system
        entry: bash scripts/run_python_tool.sh ruff format --check
        types_or: [python, pyi]
        files: ^(bindings/python/|tests/native/|noxfile.py$|scripts/check_migration.py$)
      - id: basedpyright
        name: Native binding types
        language: system
        entry: bash scripts/run_python_tool.sh nox -s types
        pass_filenames: false
        files: ^bindings/python/
      - id: codespell
        name: Spelling
        language: system
        entry: bash scripts/run_python_tool.sh codespell_lib
        files: ^(bindings/python/|tests/native/|README.md$)
      - id: nbstripout
        name: Strip notebook output
        language: system
        entry: bash scripts/run_python_tool.sh nbstripout --drop-empty-cells
        types: [jupyter]
      - id: bandit
        name: Python security
        language: system
        entry: bash scripts/run_python_tool.sh bandit -r bindings/python/innovate -q
        pass_filenames: false
        files: ^bindings/python/
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.9
    hooks:
      - id: actionlint
