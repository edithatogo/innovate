# Cargo-deny policy for innovate workspace (Order #10: ci_supply_chain_hardening_20261115)

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
deny = [{ name = "paste", reason = "RUSTSEC-2024-0436: unmaintained proc-macro" }]
multiple-versions = "warn"
# Warn until Order #3 publishes kairo-ecs-* to crates.io with explicit semver.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Temporary exception until Order #3 (rust_kairos_crates_io_20261115) publishes kairo-ecs-* to crates.io.
allow-git = [
    "https://github.com/edithatogo/kairos.git",
    "https://github.com/edithatogo/paignia.git",
]
